<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #111827;
    --card: rgba(255, 255, 255, 0.10);
    --card-border: rgba(255, 255, 255, 0.18);
    --text: #f8fafc;
    --muted: #cbd5e1;
    --primary: #7c3aed;
    --secondary: #06b6d4;
    --pink: #ec4899;
    --input: rgba(15, 23, 42, 0.55);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(124, 58, 237, 0.35), transparent 28%),
      radial-gradient(circle at top right, rgba(6, 182, 212, 0.30), transparent 24%),
      radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.20), transparent 24%),
      radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.25), transparent 22%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    cursor: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 95%);
    pointer-events: none;
    animation: gridMove 20s linear infinite;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(10px);
    pointer-events: none;
    opacity: 0.75;
    animation: drift 14s ease-in-out infinite;
    z-index: 0;
  }

  .blob.one {
    width: 180px;
    height: 180px;
    background: rgba(124, 58, 237, 0.24);
    top: 14%;
    right: 10%;
  }

  .blob.two {
    width: 140px;
    height: 140px;
    background: rgba(236, 72, 153, 0.22);
    bottom: 12%;
    left: 6%;
    animation-delay: -4s;
  }

  .blob.three {
    width: 220px;
    height: 220px;
    background: rgba(6, 182, 212, 0.18);
    bottom: 8%;
    right: 16%;
    animation-delay: -8s;
  }

  .cursor-glow {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(34,211,238,0.22), rgba(124,58,237,0.12), transparent 70%);
    transform: translate(-50%, -50%);
    z-index: 0;
    filter: blur(6px);
    transition: transform 0.08s linear;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 48px 48px; }
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0) translateX(0) scale(1); }
    50% { transform: translateY(-20px) translateX(18px) scale(1.06); }
  }

  .card {
    width: 100%;
    max-width: 560px;
    padding: 40px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: floatIn 0.7s ease;
    position: relative;
    z-index: 1;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin: 40px 0;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 26px 70px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1.heading {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #ffffff, #a5f3fc, #f9a8d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .section-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #93c5fd;
    font-weight: 700;
    margin-top: 8px;
  }

  .row {
    display: flex;
    gap: 16px;
  }

  .row .field {
    flex: 1;
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  .field label {
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--muted);
    font-weight: 500;
  }

  .field input,
  .field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: var(--input);
    color: var(--text);
    outline: none;
    font-size: 14px;
    transition: all 0.25s ease;
  }

  .field input::placeholder {
    color: #94a3b8;
  }

  .field input:focus,
  .field select:focus {
    border-color: rgba(34, 211, 238, 0.85);
    box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.16);
    transform: translateY(-1px);
  }

  .gender-group {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .gender-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }

  .gender-group input[type="radio"] {
    accent-color: var(--secondary);
    width: 16px;
    height: 16px;
  }

  .submit-btn {
    margin-top: 10px;
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--secondary), var(--pink));
    background-size: 200% 200%;
    box-shadow: 0 12px 30px rgba(124, 58, 237, 0.28);
    transition: all 0.3s ease;
  }

  .submit-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 16px 36px rgba(6, 182, 212, 0.30);
    background-position: right center;
  }

  .foot-note {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }

  .foot-note a {
    color: #67e8f9;
    text-decoration: none;
    font-weight: 700;
  }

  .foot-note a:hover {
    color: #f9a8d4;
  }

  @media (max-width: 480px) {
    .card {
      padding: 28px 18px;
      border-radius: 18px;
      margin: 24px 0;
    }

    .row {
      flex-direction: column;
    }

    h1.heading {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="card" id="card">
  <h1 class="heading">Registration</h1>

  <form id="regForm">
    <div class="section-label">Personal Details</div>
    <div class="row">
      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>
      <div class="field">
        <label>Age</label>
        <input type="number" placeholder="Age" min="1" max="120" required>
      </div>
    </div>

    <div class="field">
      <label>Date of Birth</label>
      <input type="date" required>
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="gender-group">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
    </div>

    <div class="section-label">Family Details</div>
    <div class="row">
      <div class="field">
        <label>Father's Name</label>
        <input type="text" placeholder="Father's full name" required>
      </div>
      <div class="field">
        <label>Mother's Name</label>
        <input type="text" placeholder="Mother's full name" required>
      </div>
    </div>

    <div class="section-label">Contact Details</div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" placeholder="you@example.com" required>
    </div>

    <div class="row">
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" placeholder="+91 98765 43210" required>
      </div>
      <div class="field">
        <label>Nationality</label>
        <input type="text" placeholder="e.g. Indian" required>
      </div>
    </div>

    <div class="field">
      <label>Address</label>
      <input type="text" placeholder="Street, City, State, Pincode" required>
    </div>

    <div class="section-label">Account Security</div>
    <div class="row">
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="Create a password" required>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" required>
      </div>
    </div>

    <button type="submit" class="submit-btn">Register</button>
    <div class="foot-note">Already have an account? <a href="#">Sign in</a></div>
  </form>
</div>

<script>
  const cursorGlow = document.getElementById('cursorGlow');
  const card = document.getElementById('card');

  document.addEventListener('mousemove', (e) => {
    cursorGlow.style.left = e.clientX + 'px';
    cursorGlow.style.top = e.clientY + 'px';

    const x = (e.clientX / window.innerWidth - 0.5) * 10;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    card.style.transform = `translate(${x}px, ${y}px)`;
  });

  document.addEventListener('mouseleave', () => {
    card.style.transform = 'translate(0, 0)';
  });

  document.getElementById('regForm').addEventListener('submit', e => {
    e.preventDefault();
    alert('Registration submitted successfully!');
  });
</script>

</body>
</html>
